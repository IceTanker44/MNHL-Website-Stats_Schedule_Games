<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNHL | Minecraft National Hockey League</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#090d16; color:#f1f5f9; }
  .font-display { font-family:'Teko',sans-serif; letter-spacing:.04em; }
  .card { background:rgba(15,23,42,.8); border:1px solid rgba(56,189,248,.15); }
  .nav-btn.active { background:#0284c7; color:#fff; }
</style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-50 bg-slate-950/90 border-b border-slate-800 backdrop-blur">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <h1 class="font-display text-3xl font-bold">🏒 MNHL <span class="text-sky-400">INFO HUB</span></h1>
    <nav id="nav" class="flex flex-wrap gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800"></nav>
    <div class="flex items-center gap-3"><a href="https://discord.gg/hzamb3jURt" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold">Join Discord</a><span id="updated" class="text-xs text-slate-400"></span></div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loader" class="text-center py-20 text-slate-400">Loading live data from the MNHL Google Sheet…</div>
  <div id="error" class="hidden card rounded-xl p-4 mb-6 text-red-300 text-sm"></div>
  <div id="view" class="space-y-6"></div>
</main>

<div id="modal" class="hidden fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-start justify-center p-4 overflow-y-auto"></div>

<footer class="text-center text-xs text-slate-500 py-6">MNHL Info Hub • Powered by Google Sheets &amp; GitHub Pages • <a href="https://discord.gg/hzamb3jURt" target="_blank" rel="noopener" class="text-sky-400 hover:underline">Discord</a></footer>

<script>
// ====== SETTINGS ======
const SHEET_ID = '10r_w3Sy2j50YWrX8LpvGSk7oGGgEaBKN8gJIASP4Fyo';

// Paste your Google Form link here (the "viewform" link) to turn on free agent registration.
const FREE_AGENT_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSciVKGc0y7LX-s-YR7Lcsvj23UYpMoIULXDqygMX9CoJQkxag/viewform';
const DISCORD_URL = 'https://discord.gg/hzamb3jURt';

// Optional: Java-account skins. Format: 'name as in the sheet (lowercase)': 'Java username'
// Most players should use the heads/ folder instead (see avatar()).
const SKINS = {
};

// Which season is the current one: 'auto' picks the newest season it finds in your sheet
// (tabs named "Season 2", "Pre-Season 2", ...). Or type a number like 2 to force it. Older seasons go in the Archive tab.
const SEASON = 'auto';

// MNHL Live on YouTube (channel ID starts with UC). The Media tab shows its live stream.
const LIVE_CHANNEL_ID = 'UCOO3uwGUhIgJ2tVQbyKwMEg';
const LIVE_CHANNEL_NAME = 'MNHL Live';

// Team / extra channels that always show on the Media tab (you can also add more in the sheet's "Media" tab).
// team must match the team name used in your sheet so it groups with them; leave '' for league-wide.
const BUILTIN_MEDIA = [
  { name: 'Clankerville Renegades', platform: 'YouTube', team: 'CV Renegades', link: 'https://www.youtube.com/channel/UCMNS82Zph3G-E-fu7oHFmLw' }
];

// Each button: its label, the sheet tab name(s) to look for, and how to draw it.
//   tab:  one name, a list of names to try, or 'gid:123' (the number after #gid= in the tab's address; survives renames)
//   type: roster | freeagents | schedule | stats | draft | archive | table
// If you rename a tab in the sheet, add its new name to that tab's list here.
// Unnumbered names (like "Regular Season Schedule" or "Drafts") are only used for Season 1, so a new season never shows old data.
const makeTabs = n => ({
  'Home':        { type: 'home',       tab: null },
  'Rosters':     { type: 'roster',     tab: "Team Roster's" },
  'Free Agents': { type: 'freeagents', tab: null },
  'Transactions': { type: 'transactions', tab: ['Transactions', 'Transaction'], optional: true },
  [`Pre-Season ${n}`]: { type: 'schedule', tab: [`Pre-Season ${n}`, ...(n === 1 ? ['Pre-Season Schedule', 'Pre-Seson Schedule', 'Pre-Season'] : [])] },
  [`Season ${n}`]:     { type: 'schedule', tab: [`Season ${n}`, ...(n === 1 ? ['Regular Season Schedule', 'Regular Season Secdule', 'Regular Season'] : [])] },
  'Player Stats': { type: 'stats', tab: ['Player Overall Tracker', 'Player Stats', 'Player Tracker', 'Overall Tracker', 'Stats'] },
  [`S${n} Draft`]: { type: 'draft', tab: [`Season ${n} Draft`, `Drafts S${n}`, `S${n} Draft`, ...(n === 1 ? ['Drafts', 'Draft'] : [])] },
  'Mock Drafts':  { type: 'draft', tab: ['Mock Drafts', 'Mock Draft', 'Mock'] },
  'Media':        { type: 'media',      tab: ['Media', 'Socials'], optional: true },
  'Archive':      { type: 'archive',    tab: null }
});
let CURRENT_SEASON = SEASON === 'auto' ? 1 : SEASON;
let TABS = makeTabs(CURRENT_SEASON);
const REFRESH_MS = 60000;
// =======================

const data = {};
let current = Object.keys(TABS)[0];
const labelsOf = type => Object.keys(TABS).filter(l => TABS[l].type === type);
const rowsOf = type => { const l = labelsOf(type)[0]; return l ? data[l] : undefined; };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// headers=0 stops Google from merging the top rows into one giant header
const csvUrl = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&${/^gid:\d+$/i.test(tab) ? 'gid=' + tab.slice(4) : 'sheet=' + encodeURIComponent(tab)}`;

async function fetchTab(tab) {
  const res = await fetch(csvUrl(tab) + '&_=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for tab "' + tab + '"');
  const text = await res.text();
  return Papa.parse(text, { skipEmptyLines: true }).data
    .map(r => r.map(c => (c || '').trim()))
    .filter(r => r.some(c => c !== ''));
}

const slug = n => (n || '').toLowerCase().replace(/[^a-z0-9_]+/g, '-').replace(/^-+|-+$/g, '');

// Bedrock skin lookup by gamertag via the GeyserMC Global API (best effort, see notes).
// Only works for players who have joined a Geyser/Floodgate server before; otherwise returns null.
const headCache = {};
function geyserHead(name) {
  if (headCache[name] !== undefined) return headCache[name];
  headCache[name] = (async () => {
    try {
      const x = await (await fetch(`https://api.geysermc.org/v2/xbox/xuid/${encodeURIComponent(name)}`)).json();
      if (!x.xuid) return null;
      const sk = await (await fetch(`https://api.geysermc.org/v2/skin/${x.xuid}`)).json();
      if (!sk.texture_id) return null;
      const img = new Image(); img.crossOrigin = 'anonymous';
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = `https://textures.minecraft.net/texture/${sk.texture_id}`; });
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
      g.drawImage(img, 8, 8, 8, 8, 0, 0, 64, 64);   // face
      g.drawImage(img, 40, 8, 8, 8, 0, 0, 64, 64);  // hat layer
      return c.toDataURL();
    } catch (e) { return null; }
  })();
  return headCache[name];
}
// Order: heads/<name>.png in the repo -> Geyser lookup by gamertag -> optional Java skin -> initials
async function headFallback(el) {
  const box = el.parentElement, name = el.dataset.n, java = el.dataset.j;
  el.remove();
  let src = await geyserHead(name);
  if (!src && java) src = `https://mc-heads.net/avatar/${encodeURIComponent(java)}/96`;
  if (src && box.isConnected) box.insertAdjacentHTML('beforeend', `<img src="${src}" alt="" class="absolute inset-0 w-full h-full rounded-lg object-cover" style="image-rendering:pixelated">`);
}
const avatar = (name, size) => {
  const ini = (name || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
  let h = 0; for (const ch of (name || '')) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const java = SKINS[(name || '').toLowerCase()] || '';
  const img = slug(name) ? `<img src="heads/${slug(name)}.png" alt="" data-n="${esc(name)}" data-j="${esc(java)}" class="absolute inset-0 w-full h-full rounded-lg object-cover" style="image-rendering:pixelated" onerror="headFallback(this)">` : '';
  return `<div class="relative ${size} rounded-lg flex items-center justify-center font-display font-bold text-white shrink-0 overflow-hidden" style="background:hsl(${h} 55% 35%)">${esc(ini)}${img}</div>`;
};

// ---------- Rosters + Free Agents ----------
function parseRosters(rows) {
  const teams = []; let team = null;
  rows.forEach((r, idx) => {
    const name = r[0];
    if (!name || name === "Team Roster's" || name === 'Name') return;
    const nextIsHeader = (rows[idx + 1] || [])[0] === 'Name';
    const hasWins = r.some(c => /^wins\b/i.test(c));
    if (hasWins || nextIsHeader || /^(draft players|free agents)$/i.test(name)) {
      team = { name, record: r.find(c => /^wins\b/i.test(c)) || '', players: [] }; teams.push(team);
    } else if (team) {
      team.players.push({ name, num: r[1] || '', pos: r[2] || 'Any', ovr: r[3] || '0', proj: r[4] || '0', pts: r[5] || '0', gp: r[7] || '0' });
    }
  });
  return teams;
}

function playerRow(p) {
  const cap = p.num.startsWith('C') ? 'C' : p.num.startsWith('A') ? 'A' : '';
  const rating = Number(p.ovr) > 0 ? p.ovr + ' OVR' : (Number(p.proj) > 0 ? p.proj + ' PROJ' : '');
  const num = p.num.replace(/^[CA]/, '').replace('#', '');
  const unk = p.name === '???';
  return `<div ${unk ? '' : `data-player="${esc(p.name)}"`} class="flex items-center justify-between bg-slate-900/70 p-2.5 rounded-xl border border-slate-800 transition ${unk ? 'opacity-80' : 'cursor-pointer hover:border-sky-500'}">
    <div class="flex items-center gap-3">
      ${avatar(p.name, 'w-9 h-9 text-lg')}
      <div>
        <p class="font-bold text-sm ${unk ? 'italic text-slate-300' : ''}">${unk ? 'Unknown Player' : esc(p.name)} ${cap ? `<span class="ml-1 px-1.5 text-[10px] font-black bg-amber-500 text-slate-950 rounded">${cap}</span>` : ''}</p>
        <p class="text-xs text-slate-400">${num ? '#' + esc(num) + ' • ' : ''}${esc(p.pos)}</p>
      </div>
    </div>
    ${rating ? `<span class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 font-bold text-xs">${esc(rating)}</span>` : ''}
  </div>`;
}

function renderRosters(rows) {
  const teams = parseRosters(rows).filter(t => t.players.length && !/free agents/i.test(t.name));
  if (!teams.length) return `<p class="text-slate-400">No players found yet.</p><p class="text-xs text-slate-500 mt-2">Debug: read ${rows.length} rows. First row: ${esc(JSON.stringify((rows[0]||[]).slice(0,6)))}</p>`;
  return `<div class="grid md:grid-cols-2 gap-6">` + teams.map(t => `
    <div class="card rounded-2xl p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display text-2xl font-bold">${esc(t.name)}</h3>
        <span class="text-xs text-slate-400">${esc(t.record)} • ${t.players.length} players</span>
      </div>
      <div class="space-y-2">${t.players.map(playerRow).join('')}</div>
    </div>`).join('') + `</div>`;
}

function renderFreeAgents(rows) {
  const fa = parseRosters(rows || []).filter(t => /free agents/i.test(t.name)).flatMap(t => t.players);
  const list = fa.length
    ? `<div class="space-y-2">${fa.map(playerRow).join('')}</div>`
    : '<p class="text-slate-400 text-sm">No free agents listed right now.</p>';
  const form = FREE_AGENT_FORM_URL
    ? `<iframe src="${esc(FREE_AGENT_FORM_URL)}${FREE_AGENT_FORM_URL.includes('?') ? '&' : '?'}embedded=true" class="w-full rounded-xl bg-white" style="height:900px" frameborder="0">Loading…</iframe>
       <a href="${esc(FREE_AGENT_FORM_URL)}" target="_blank" rel="noopener" class="inline-block mt-3 px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm">Open form in new tab</a> <a href="${DISCORD_URL}" target="_blank" rel="noopener" class="inline-block mt-3 ml-2 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">Join the Discord</a>`
    : '<p class="text-slate-400 text-sm">Free agent registration isn’t open yet. Check back soon!</p>';
  return `<div class="grid lg:grid-cols-2 gap-6">
    <div class="card rounded-2xl p-5"><h3 class="font-display text-2xl font-bold mb-4">AVAILABLE FREE AGENTS</h3>${list}</div>
    <div class="card rounded-2xl p-5"><h3 class="font-display text-2xl font-bold mb-4">REGISTER AS A FREE AGENT</h3>${form}</div>
  </div>`;
}

// Game rows: find columns from the "Team Home / Team Away / ..." header row so tabs with extra logo columns still line up
const GC_DEFAULT = { home: 1, away: 3, time: 4, winner: 5, proj: 6, score: 7, stars: 8 };  // res (how it ended) is optional
function updateGameCols(r, gc) {
  const f = re => r.findIndex(x => re.test(x));
  const m = { home: f(/^(team )?home$/i), away: f(/^(team )?away$/i), time: f(/^sched(ule|uled) time$/i), winner: f(/^winner$/i),
              proj: f(/^projected winner$/i), score: f(/^score$/i), stars: f(/3 st/i), res: f(/win in reg|reg\s*\/\s*ot/i) };
  if (m.home < 0 || m.away < 0) return false;       // not a games header row
  const shift = m.away - GC_DEFAULT.away;
  Object.keys(GC_DEFAULT).forEach(k => { gc[k] = m[k] >= 0 ? m[k] : GC_DEFAULT[k] + shift; });
  gc.res = m.res;                                   // -1 when the tab has no "Win in Reg/OT" column
  return true;
}

// ---------- Schedule / standings (Season 1 and Pre-Season 1) ----------
function renderSchedule(rows) {
  let inStats = false, playoff = false, round = '';
  const col = { place: 1, pts: 3, gp: 4, w: 5, l: 6, otl: 7 };
  const games = [], stand = [];
  const gc = { ...GC_DEFAULT, res: -1 };
  for (const r of rows) {
    const a = r[0];
    const filled = r.filter(x => x !== '');
    if (updateGameCols(r, gc)) continue;
    if (r.some(x => /^placement$/i.test(x))) {           // standings header row -> map columns by name
      const find = re => r.findIndex(x => re.test(x));
      const m = { place: find(/^placement$/i), pts: find(/^points?$/i), gp: find(/^(games played|gp)$/i),
                  w: find(/^wins?$/i), l: find(/^loss(es)?$/i), otl: find(/^ot\s*loss/i) };
      Object.keys(m).forEach(k => { if (m[k] >= 0) col[k] = m[k]; });
      inStats = true; continue;
    }
    if (/^game\s*\d+/i.test(a) && !inStats) {
      const w = r[gc.winner] || '';
      const win = /^(tbd|winner|wins?)$/i.test(w) ? '' : w;
      games.push({ game: a, home: r[gc.home] || 'TBD', away: r[gc.away] || 'TBD', time: r[gc.time] || 'TBD', winner: win, proj: r[gc.proj], score: r[gc.score] || '', stars: r[gc.stars] || '', res: gc.res >= 0 ? (r[gc.res] || '') : '', playoff, round });
    } else if (filled.length === 1 && a) {
      if (/^stats$/i.test(a)) inStats = true;
      else if (/^(games|team|home|away)$/i.test(a)) continue;
      else if (/1st vs 4th/i.test(a)) { playoff = true; round = 'Semifinal · 1st vs 4th'; }
      else if (/2nd vs 3rd/i.test(a)) { playoff = true; round = 'Semifinal · 2nd vs 3rd'; }
      else if (/^playoffs?$/i.test(a)) { playoff = true; round = 'Finals'; }
      else if (/playoff|semifinal/i.test(a)) { playoff = true; round = ''; }
      else { playoff = false; round = ''; games.push({ banner: a }); }
    } else if (a && /^\d+$/.test(r[col.place] || '') && !/^game/i.test(a)) {
      stand.push({ team: a, place: +r[col.place], pts: r[col.pts] || 0, gp: r[col.gp] || 0, w: r[col.w] || 0, l: r[col.l] || 0, otl: r[col.otl] || 0 });
    }
  }
  if (!games.length && !stand.length) return null;
  stand.sort((x, y) => x.place - y.place);
  let html = '';
  if (stand.length) html += `<div class="card rounded-2xl overflow-x-auto p-2"><table class="w-full text-left text-sm">
    <thead><tr class="text-xs uppercase text-slate-400 border-b border-slate-800"><th class="p-2">#</th><th class="p-2">Team</th><th class="p-2">GP</th><th class="p-2">W</th><th class="p-2">L</th><th class="p-2">OTL</th><th class="p-2 text-sky-400">PTS</th></tr></thead><tbody class="divide-y divide-slate-800/60">
    ${stand.map(t => `<tr><td class="p-2">${t.place}</td><td class="p-2 font-bold">${esc(t.team)}</td><td class="p-2">${esc(t.gp)}</td><td class="p-2">${esc(t.w)}</td><td class="p-2">${esc(t.l)}</td><td class="p-2">${esc(t.otl)}</td><td class="p-2 font-bold text-sky-400">${esc(t.pts)}</td></tr>`).join('')}
    </tbody></table></div>`;
  const card = x => {
    const done = x.winner !== '';
    const sc = (x.score || '').match(/^(\d+)\s*[-–:]\s*(\d+)$/);
    const hs = sc ? sc[1] : '', as = sc ? sc[2] : '';
    const hWon = done && teamKey(x.winner) === teamKey(x.home), aWon = done && teamKey(x.winner) === teamKey(x.away);
    const col = won => !done ? '' : (won ? 'text-emerald-400' : 'text-red-400');
    const hasStars = x.stars && /[A-Za-z0-9]/.test(x.stars.replace(/\?/g, ''));
    const stars = hasStars ? `<p class="text-xs text-amber-300 mt-2">Stars: ${esc(x.stars.replace(/\?\?\?/g, '–'))}</p>` : '';
    return `<div class="card rounded-xl p-3.5 ${x.playoff ? 'border-amber-500/50' : ''}">
      <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
        <span class="flex items-center gap-2"><span class="font-bold uppercase text-slate-300">${esc(x.game)}</span>${done ? `<span class="px-2 py-0.5 rounded font-bold bg-emerald-500/20 text-emerald-300">${['Final', x.res, sc ? '' : x.score].filter(Boolean).map(esc).join(' ')}</span>` : ''}</span>
        <span class="px-2 py-0.5 rounded font-bold bg-sky-500/20 text-sky-300">${esc(x.time)}</span></div>
      <div class="flex justify-between items-center font-bold text-sm gap-2">
        <span class="${col(hWon)}">${esc(x.home)}${hs !== '' ? ` <span class="ml-1 text-white">${hs}</span>` : ''}</span><span class="text-xs text-slate-500">VS</span>
        <span class="${col(aWon)}">${as !== '' ? `<span class="mr-1 text-white">${as}</span> ` : ''}${esc(x.away)}</span></div>
      ${!done && x.proj ? `<p class="text-xs text-slate-400 mt-1">Projected: ${esc(x.proj)}</p>` : ''}${stars}</div>`;
  };
  const regular = games.filter(x => !x.playoff), po = games.filter(x => x.playoff);
  if (regular.length) html += `<h3 class="font-display text-2xl font-bold text-sky-400 mt-6">${po.length ? 'REGULAR SEASON' : 'GAMES'}</h3><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">` +
    regular.map(x => x.banner
      ? `<div class="col-span-full text-center text-xs font-bold uppercase tracking-wider text-slate-400 border-y border-slate-800 py-1.5">${esc(x.banner)}</div>`
      : card(x)).join('') + `</div>`;
  if (po.length) {
    html += `<div class="mt-10 pt-6 border-t-2 border-amber-500/40"><h3 class="font-display text-3xl font-bold text-amber-400">🏆 PLAYOFFS</h3></div>`;
    [...new Set(po.map(x => x.round || 'Playoffs'))].forEach(r => {
      const g = po.filter(x => (x.round || 'Playoffs') === r);
      html += `<h4 class="font-display text-xl font-bold text-slate-300 mt-4 mb-2">${esc(r.toUpperCase())}</h4>
        <div class="grid gap-4 md:grid-cols-3 ${g.length >= 4 ? 'xl:grid-cols-5' : ''}">${g.map(card).join('')}</div>`;
    });
  }
  return html;
}

// ---------- Draft board ----------
function renderDraft(rows) {
  const rounds = []; let cur = null;
  for (const r of rows) {
    const filled = r.filter(x => x);
    if (/^round\b/i.test(r[0]) && filled.length === 1) { cur = { name: r[0], picks: [] }; rounds.push(cur); continue; }
    if (!cur || filled.length < 2 || /^team$/i.test(r[0])) continue;
    cur.picks.push({ team: r[0], player: r[1] || '???', pos: r[2] || 'Any', num: r[3] || '', proj: r[4] || '', last: r[5] || '' });
  }
  if (!rounds.length) return null;
  return `<div class="grid lg:grid-cols-2 gap-6">` + rounds.map(rd => `
    <div class="card rounded-2xl p-5"><h3 class="font-display text-2xl font-bold text-sky-400 mb-4">${esc(rd.name.toUpperCase())}</h3>
    <div class="space-y-2">${rd.picks.map((p, i) => `
      <div class="flex items-center gap-3 bg-slate-900/70 p-2.5 rounded-xl border border-slate-800">
        <span class="w-7 text-center font-display text-2xl text-sky-400">${i + 1}</span>
        ${avatar(p.player, 'w-9 h-9 text-lg')}
        <div class="flex-1 min-w-0"><p class="font-bold text-sm ${p.player === '???' ? 'italic text-slate-300' : ''}">${p.player === '???' ? 'Unknown Player' : esc(p.player)} ${p.num && p.num !== '#' ? `<span class="text-xs font-normal text-slate-400">${esc(p.num)}</span>` : ''}</p>
          <p class="text-xs text-slate-400">${esc(p.team)} • ${esc(p.pos)}</p></div>
        <div class="text-right text-xs">${p.proj ? `<p class="text-amber-300 font-bold">${esc(p.proj)} PROJ</p>` : ''}<p class="text-slate-500">Last: ${esc(p.last || 'None')}</p></div>

  };
  const [pre, reg, draft] = await Promise.all([get(t[`Pre-Season ${n}`].tab), get(t[`Season ${n}`].tab), get(t[`S${n} Draft`].tab)]);

// Sheet layout: Team A Player | Team A Picks | Team B Player | Team B Picks, each cell like "Maple Leafs: Cgeiser55".

const splitList = x => (x || '').split(/\s*(?:,|;|\+|&|\band\b)\s*/i).map(t => t.trim()).filter(t => t && !/^(none|n\/a|-|—)$/i.test(t));

  const m = c => { const i = (c || '').indexOf(':'); return i > 0 ? [c.slice(0, i).trim(), c.slice(i + 1).trim()] : ['', (c || '').trim()]; };
  const [t1, p] = m(playerCell), [t2, k] = m(pickCell);

}
function parseTransactions(rows) {

  if (hi < 0) return [];
  const h = rows[hi].map(c => c.toLowerCase()), f = re => h.findIndex(c => re.test(c));
  const ci = { aP: f(/team a player/), aK: f(/team a pick/), bP: f(/team b player/), bK: f(/team b pick/), date: f(/^date/), type: f(/^type/) };
  return rows.slice(hi + 1).filter(r => r.some(c => c)).map(r => ({
    type: (ci.type >= 0 && r[ci.type]) || 'Trade', date: ci.date >= 0 ? (r[ci.date] || '') : '',
    a: sideOf(r[ci.aP], r[ci.aK]), b: sideOf(r[ci.bP], r[ci.bK])
  })).filter(t => t.a.team || t.b.team).reverse();   // newest (bottom of the sheet) first
}

function standingsFrom(rows) {
  const col = { place: 1, pts: 3, gp: 4, w: 5, l: 6, otl: 7 }, out = [];

      const m = { place: f(/^placement$/i), pts: f(/^points?$/i), gp: f(/^(games played|gp)$/i), w: f(/^wins?$/i), l: f(/^loss(es)?$/i), otl: f(/^ot\s*loss/i) };
      Object.keys(m).forEach(k => { if (m[k] >= 0) col[k] = m[k]; });
      continue;
    }
    if (r[0] && /^\d+$/.test(r[col.place] || '') && !/^game/i.test(r[0]))
      out.push({ team: r[0], place: +r[col.place], pts: +r[col.pts] || 0, gp: +r[col.gp] || 0, w: +r[col.w] || 0, l: +r[col.l] || 0, otl: +r[col.otl] || 0 });

      : '<p class="text-slate-400 text-center py-8">No games scheduled.</p>'}`;
  const trades = parseTransactions(rowsOf('transactions') || []).slice(0, 3);
  const tx = `${secHead('TRANSACTION <span class="text-sky-400">HISTORY</span>', 'All moves', labelsOf('transactions')[0])}
    ${trades.length ? `<div class="space-y-2">${trades.map(t => `<div class="card rounded-xl p-3"><div class="flex justify-between items-center mb-1.5">
        <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-amber-500/20 text-amber-300">${esc(t.type)}</span><span class="text-[10px] text-slate-500">${esc(t.date)}</span></div>
        <p class="text-sm">${esc(txSummary(t))}</p></div>`).join('')}</div>`
      : '<p class="text-slate-500 text-sm text-center py-6">No transactions yet.</p>'}`;
  const discord = `<div class="rounded-xl p-4 bg-gradient-to-br from-indigo-500 to-indigo-700"><p class="text-[10px] font-bold uppercase tracking-wider bg-white/20 inline-block px-2 py-0.5 rounded">Community Hub</p>
    <p class="font-bold text-lg mt-2">Join the Official Discord</p><p class="text-sm text-indigo-100">Chat with players, find a team and get live game updates.</p>
    <div class="flex gap-2 mt-3"><a href="${DISCORD_URL}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-white text-indigo-700 text-sm font-bold">Join Discord</a>
      <button data-t="Free Agents" onclick="goTab(this.dataset.t)" class="px-3 py-1.5 rounded-lg bg-indigo-900/60 hover:bg-indigo-900 text-white text-sm font-bold">Free Agent Signup</button></div></div>`;

  return `<div id="home-root" class="space-y-8">
    ${ticker ? `<div class="flex gap-3 overflow-x-auto pb-2">${ticker}</div>` : ''}
    <div class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2 space-y-10"><div>${left}</div>
        <div class="grid md:grid-cols-2 gap-8"><div>${standings}</div><div>${leadersHtml}</div></div></div>
      <div class="space-y-8"><div>${stream}</div><div>${up}</div><div>${tx}</div>${discord}</div>
    </div></div>`;
}

// ---------- Generic table (stats, drafts, anything else) ----------
function renderGeneric(rows, searchable) {
  if (!rows.length) return '<p class="text-slate-400">This tab is empty.</p>';
  const keep = [...Array(Math.max(...rows.map(r => r.length))).keys()].filter(i => rows.some(r => r[i]));
  const q = searchable ? (document.getElementById('q')?.value || '').toLowerCase() : '';
  let html = '', open = false, hdr = true;
  const close = () => { if (open) { html += '</tbody></table></div>'; open = false; } };
  for (const r of rows) {
    if (r.filter(c => c).length === 1 && r[0]) {
      close(); html += `<h3 class="font-display text-2xl font-bold text-sky-400 mt-6">${esc(r[0])}</h3>`; hdr = true; continue;
    }
    if (q && !hdr && !r.join(' ').toLowerCase().includes(q)) continue;
    if (!open) { html += '<div class="card rounded-2xl overflow-x-auto"><table class="w-full text-left text-sm"><tbody class="divide-y divide-slate-800/60">'; open = true; }
    const t = hdr ? 'th' : 'td';
    html += `<tr${(!hdr && searchable) ? ` data-player="${esc(r[0])}" class="cursor-pointer hover:bg-slate-800/60"` : ''}>` + keep.map(i => `<${t} class="py-2 px-3 whitespace-nowrap ${hdr ? 'text-xs uppercase text-slate-300 bg-slate-900/90' : ''}">${esc(r[i])}</${t}>`).join('') + '</tr>';
    hdr = false;
  }
  close();
  return html;
}

function render() {
  const view = document.getElementById('view');
  const type = TABS[current].type;
  if (type === 'archive') { renderArchive(); return; }
  if (type === 'media') {
    const sig = JSON.stringify(data[current] || []);
    if (mediaSig === sig && document.getElementById('media-root')) { drawFeed(); return; }
    mediaSig = sig;
    view.innerHTML = `<h2 class="font-display text-3xl font-bold">${esc(current.toUpperCase())}</h2>` + renderMedia(data[current] || []);
    drawFeed();
    return;
  }
  mediaSig = '';
  if (type === 'home') {
    if (document.querySelector('#home-root iframe')) return;
    view.innerHTML = renderHome();
    return;
  }
  const rows = type === 'freeagents' ? rowsOf('roster') : data[current];
  if (!rows) { view.innerHTML = '<p class="text-slate-400">This tab wasn’t found. Check that its name in your sheet matches the TABS list at the top of the script.</p>'; return; }
  const stats = type === 'stats';
  const prevQ = document.getElementById('q')?.value || '';
  let body;
  if (type === 'roster') body = renderRosters(rows);
  else if (type === 'freeagents') body = renderFreeAgents(rows);
  else if (type === 'transactions') body = renderTransactions(rows);
  else if (type === 'draft') body = renderDraft(rows) || renderGeneric(rows, false);
  else if (type === 'schedule') body = renderSchedule(rows) || renderGeneric(rows, false);
  else body = renderGeneric(rows, stats);
  view.innerHTML = `<h2 class="font-display text-3xl font-bold">${esc(current.toUpperCase())}</h2>` +
    (stats ? `<input id="q" oninput="render()" placeholder="Search player…" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm">` : '') + body;
  const qEl = document.getElementById('q');
  if (qEl && prevQ) { qEl.value = prevQ; qEl.focus(); }
}

function buildNav() {
  document.getElementById('nav').innerHTML = Object.keys(TABS).map(l =>
    `<button data-tab="${esc(l)}" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-300 hover:text-white ${l === current ? 'active' : ''}">${esc(l)}</button>`).join('');
  document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => {
    current = b.dataset.tab;
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
}

const resolved = {};   // remembers which tab name worked
const sameRows = (a, b) => JSON.stringify(a.slice(0, 6)) === JSON.stringify(b.slice(0, 6));
async function load() {
  loadFeed();
  const err = document.getElementById('error');
  const failed = [];
  const rosterLabel = labelsOf('roster')[0];
  let base = null;
  if (rosterLabel) {
    try { base = await fetchTab([].concat(TABS[rosterLabel].tab)[0]); data[rosterLabel] = base; }
    catch (e) { failed.push(rosterLabel + ' (' + e.message + ')'); }
  }
  await Promise.all(Object.entries(TABS).filter(([l, c]) => c.tab && l !== rosterLabel).map(async ([label, c]) => {
    const names = [].concat(c.tab); if (resolved[label]) names.unshift(resolved[label]);
    for (const n of names) {
      try {
        const rows = await fetchTab(n);
        if (base && sameRows(rows, base)) continue;   // Google returns the first tab when a name doesn't exist
        resolved[label] = n; data[label] = rows; return;
      } catch (e) { /* try next name */ }
    }
    delete data[label];
    if (!c.optional) failed.push(label + ' (tab not found, check its exact name)');
  }));
  document.getElementById('loader').classList.add('hidden');
  err.classList.toggle('hidden', !failed.length);
  if (failed.length) err.textContent = 'Could not load: ' + failed.join('; ');
  document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  render();
}

// ---------- Player pages (click any player) ----------
// Google's CSV feed blanks header cells in number-heavy columns, so fall back to known labels.
const ROSTER_LABELS = ['Name', 'Number', 'Position', 'Overall', 'Projected Overall', 'PTS', 'Rank', 'GP', 'PTS Per Game', '3 Stars of the Game'];
const STAT_LABELS = ['Player', 'Pos', 'GP', 'Goals', 'Shots', 'Points', 'Hits', 'Faceoff Wins', 'Faceoffs', 'Blocked Shots', 'Shots Against', 'Penalties', 'Overall'];

const teamKey = n => (n || '').toLowerCase().replace(/rengades/g, 'renegades').replace(/[^a-z]/g, '');
const sameTeam = (a, b) => { a = teamKey(a); b = teamKey(b); return a && b && (a.includes(b) || b.includes(a)); };

function gamesFrom(rows) {
  const out = []; let inStats = false; const gc = { ...GC_DEFAULT, res: -1 };
  (rows || []).forEach(r => {
    if (updateGameCols(r, gc)) return;
    if (r.some(x => /^placement$/i.test(x)) || (r.filter(x => x).length === 1 && /^stats$/i.test(r[0]))) inStats = true;
    if (!inStats && /^game\s*\d+/i.test(r[0])) {
      const w = r[gc.winner] || '';
      out.push({ game: r[0], home: r[gc.home] || '', away: r[gc.away] || '', time: r[gc.time] || '', winner: /^(tbd|winner|wins?)$/i.test(w) ? '' : w, res: gc.res >= 0 ? (r[gc.res] || '') : '', score: r[gc.score] || '', stars: r[gc.stars] || '' });
    }
  });
  return out;
}

function recentGames(team, name) {
  if (!team) return [];
  const key = name.toLowerCase();
  const all = labelsOf('schedule').flatMap(l => gamesFrom(data[l]).map(g => ({ ...g, label: l })));
  return all.filter(g => g.winner && (sameTeam(g.home, team) || sameTeam(g.away, team)))
    .slice(-5).reverse()
    .map(g => ({ ...g, opp: sameTeam(g.home, team) ? g.away : g.home, won: sameTeam(g.winner, team), star: g.stars.toLowerCase().includes(key) }));
}

function findPlayer(name) {
  const key = name.trim().toLowerCase();
  const out = { name, team: '', roster: [], stats: [], recent: [] };
  let hdr = null, team = '';
  const rr = rowsOf('roster') || [];
  rr.forEach((r, idx) => {
    const n = r[0];
    if (!n || n === "Team Roster's") return;
    if (n === 'Name') { hdr = r; return; }
    const nextIsHeader = (rr[idx + 1] || [])[0] === 'Name';
    if (r.some(c => /^wins\b/i.test(c)) || nextIsHeader || /^(draft players|free agents)$/i.test(n)) { team = n; return; }
    if (n.toLowerCase() === key && !out.roster.length) {
      out.team = team;
      r.forEach((v, i) => { const l = (hdr && hdr[i]) || ROSTER_LABELS[i]; if (i > 0 && v !== '' && l) out.roster.push([l, v]); });
    }
  });
  let sh = null;
  (rowsOf('stats') || []).forEach(r => {
    const filled = r.filter(c => c);
    if (filled.length >= 3 && filled.every(c => isNaN(Number(c)))) sh = r;
    if (r[0] && r[0].toLowerCase() === key && !out.stats.length) {
      r.forEach((v, i) => { const l = (sh && sh[i]) || STAT_LABELS[i]; if (i > 0 && v !== '' && l) out.stats.push([l, v]); });
    }
  });
  out.recent = recentGames(out.team, name);
  return out;
}

function openPlayer(name) {
  const p = findPlayer(name);
  const get = k => (p.roster.find(([l]) => l === k) || [])[1];
  const chips = [['OVR', get('Overall')], ['PROJ', get('Projected Overall')], ['PTS', get('PTS')], ['GP', get('GP')]]
    .filter(([, v]) => v !== undefined).map(([l, v]) => `<span class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 font-bold text-xs">${l} ${esc(v)}</span>`).join('');
  const tiles = list => list.map(([k, v]) => `<div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3">
    <p class="text-[11px] uppercase text-slate-400">${esc(k)}</p><p class="font-bold text-lg">${esc(v)}</p></div>`).join('');
  const recent = p.recent.map(g => `<div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-sm">
    <div><span class="font-bold ${g.won ? 'text-emerald-400' : 'text-red-400'}">${g.won ? 'W' : 'L'}</span> vs ${esc(g.opp)}
      <span class="text-xs text-slate-500 ml-1">${esc(g.label)} • ${esc(g.game)}</span></div>
    <div class="text-right">${g.score ? `<span class="font-bold">${esc(g.score)}</span>` : ''}${g.star ? ' <span class="text-amber-300 text-xs">⭐ Star of the game</span>' : ''}</div></div>`).join('');
  document.getElementById('modal').innerHTML = `<div class="card rounded-2xl p-6 w-full max-w-2xl mt-10 bg-slate-950" onclick="event.stopPropagation()">
    <div class="flex items-start justify-between gap-4 mb-4">
      <div class="flex items-center gap-4">
        ${avatar(p.name, 'w-20 h-20 text-4xl')}
        <div><h3 class="font-display text-4xl font-bold leading-none">${esc(p.name)}</h3>
        <p class="text-sky-400 text-sm mt-1">${esc(p.team || 'No team listed')}</p></div>
      </div>
      <button onclick="closePlayer()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
    </div>
    ${chips ? `<div class="flex flex-wrap gap-2 mb-5">${chips}</div>` : ''}
    ${p.stats.length ? `<h4 class="font-display text-xl text-sky-400 mb-2">SEASON STATS</h4><div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-5">${tiles(p.stats)}</div>` : ''}
    <h4 class="font-display text-xl text-sky-400 mb-2">RECENT GAMES</h4>
    <div class="space-y-2 mb-5">${recent || '<p class="text-slate-400 text-sm">No completed games for this team yet.</p>'}</div>
    ${p.roster.length ? `<h4 class="font-display text-xl text-sky-400 mb-2">PLAYER INFO</h4><div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${tiles(p.roster)}</div>` : ''}
    ${!p.roster.length && !p.stats.length ? '<p class="text-slate-400 text-sm">No details found for this player yet.</p>' : ''}
  </div>`;
  const m = document.getElementById('modal');
  m.classList.remove('hidden'); m.onclick = closePlayer;
}
function closePlayer() { document.getElementById('modal').classList.add('hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
document.addEventListener('click', e => { const el = e.target.closest('[data-player]'); if (el) openPlayer(el.dataset.player); });

// Newest season = highest N that has a "Season N" or "Pre-Season N" tab (Google returns the first tab for names that don't exist)
async function detectSeason() {
  if (SEASON !== 'auto') return SEASON;
  const base = await fetchTab([].concat(TABS['Rosters'].tab)[0]);
  const hits = await Promise.all([1, 2, 3, 4, 5, 6, 7, 8].map(async n => {
    for (const name of [`Season ${n}`, `Pre-Season ${n}`]) {
      try { if (!sameRows(await fetchTab(name), base)) return n; } catch (e) { /* not there */ }
    }
    return 0;
  }));
  return Math.max(1, ...hits);
}
async function init() {
  try { CURRENT_SEASON = await detectSeason(); TABS = makeTabs(CURRENT_SEASON); } catch (e) { /* keep defaults */ }
  current = Object.keys(TABS)[0];
  buildNav();
  await load();
  setInterval(load, REFRESH_MS);
}
init();
</script>
