<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNHL | Minecraft National Hockey League</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background:#090d16; color:#f1f5f9; }
  .font-display { font-family: 'Teko', sans-serif; letter-spacing: .04em; }
  .card { background: rgba(15,23,42,.8); border:1px solid rgba(56,189,248,.15); }
  .nav-btn.active { background:#0284c7; color:#fff; }
</style>
</head>
<body class="min-h-screen">
 
<header class="sticky top-0 z-50 bg-slate-950/90 border-b border-slate-800 backdrop-blur">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <h1 class="font-display text-3xl font-bold">🏒 MNHL <span class="text-sky-400">INFO HUB</span></h1>
    <nav id="nav" class="flex flex-wrap gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800"></nav>
    <span id="updated" class="text-xs text-slate-400"></span>
  </div>
</header>
 
<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loader" class="text-center py-20 text-slate-400">Loading live data from the MNHL Google Sheet…</div>
  <div id="error" class="hidden card rounded-xl p-6 text-red-300"></div>
  <div id="view" class="space-y-8"></div>
</main>
 
<footer class="text-center text-xs text-slate-500 py-6">MNHL Info Hub • Powered by Google Sheets &amp; GitHub Pages</footer>
 
<script>
// ====== SETTINGS ======
const SHEET_ID = '10r_w3Sy2j50YWrX8LpvGSk7oGGgEaBKN8gJIASP4Fyo';
// label shown on the button -> exact tab name in your sheet
const TABS = {
  'Rosters':        "Team Roster's",
  'Season 1':       'Season 1',
  'Pre-Season 1':   'Pre-Season 1',
  'Player Stats':   'Player Overall Tracker',
  'S1 Draft':       'Drafts S1-S1',
  'Mock Drafts':    'Mock Drafts'
};
const REFRESH_MS = 60000; // re-pull the sheet every 60 seconds
// =======================
 
const data = {};
let current = 'Rosters';
 
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const csvUrl = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
 
async function fetchTab(tab) {
  const res = await fetch(csvUrl(tab) + '&_=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for tab "' + tab + '"');
  const text = await res.text();
  return Papa.parse(text, { skipEmptyLines: true }).data
    .map(r => r.map(c => (c || '').trim()))
    .filter(r => r.some(c => c !== ''));
}
 
function head(name) {
  const clean = (name || '').replace(/[^A-Za-z0-9_]/g, '');
  return clean ? `https://mc-heads.net/avatar/${clean}/40` : '';
}
 
// ---------- Rosters (team header row has "Wins ..." in it) ----------
function renderRosters(rows) {
  const teams = [];
  let team = null;
  for (const r of rows) {
    const name = r[0];
    if (!name || name === "Team Roster's") continue;
    if (r.some(c => /^wins\b/i.test(c))) {
      team = { name, record: r.find(c => /^wins\b/i.test(c)), players: [] };
      teams.push(team);
    } else if (/^(draft players|free agents)$/i.test(name)) {
      team = { name, record: '', players: [] };
      teams.push(team);
    } else if (name === 'Name') {
      continue;
    } else if (team && name !== '???') {
      team.players.push({ name, num: r[1] || '', pos: r[2] || 'Any', ovr: r[3] || '0', proj: r[4] || '0', pts: r[5] || '0' });
    }
  }
  const shown = teams.filter(t => t.players.length);
  if (!shown.length) return '<p class="text-slate-400">No players found yet.</p>';
  return `<div class="grid md:grid-cols-2 gap-6">` + shown.map(t => `
    <div class="card rounded-2xl p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display text-2xl font-bold">${esc(t.name)}</h3>
        <span class="text-xs text-slate-400">${esc(t.record)}</span>
      </div>
      <div class="space-y-2">${t.players.map(p => {
        const cap = p.num.startsWith('C') ? 'C' : p.num.startsWith('A') ? 'A' : '';
        const rating = Number(p.ovr) > 0 ? p.ovr + ' OVR' : p.proj + ' PROJ';
        const src = head(p.name);
        return `<div class="flex items-center justify-between bg-slate-900/70 p-2.5 rounded-xl border border-slate-800">
          <div class="flex items-center gap-3">
            ${src ? `<img src="${src}" class="w-9 h-9 rounded-lg bg-slate-800" alt="" loading="lazy">` : ''}
            <div>
              <p class="font-bold text-sm">${esc(p.name)} ${cap ? `<span class="ml-1 px-1.5 text-[10px] font-black bg-amber-500 text-slate-950 rounded">${cap}</span>` : ''}</p>
              <p class="text-xs text-slate-400">${esc(p.num.replace(/^[CA]/, ''))} • ${esc(p.pos)}</p>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 font-bold text-xs">${esc(rating)}</span>
        </div>`;
      }).join('')}</div>
    </div>`).join('') + `</div>`;
}
 
// ---------- Generic renderer: works for any tab layout ----------
// A row with only one filled cell = section title. The row after it = column headers.
function renderGeneric(rows, searchable) {
  if (!rows.length) return '<p class="text-slate-400">This tab is empty.</p>';
  const q = searchable ? (document.getElementById('q')?.value || '').toLowerCase() : '';
  let html = '', open = false, nextIsHeader = true;
  const close = () => { if (open) { html += '</tbody></table></div>'; open = false; } };
  const begin = () => { if (!open) { html += '<div class="card rounded-2xl overflow-x-auto"><table class="w-full text-left text-sm"><tbody class="divide-y divide-slate-800/60">'; open = true; } };
  for (const r of rows) {
    const filled = r.filter(c => c !== '');
    if (filled.length === 1 && r[0] !== '') {
      close();
      html += `<h3 class="font-display text-2xl font-bold text-sky-400 mt-6 mb-2">${esc(r[0])}</h3>`;
      nextIsHeader = true;
      continue;
    }
    if (q && !r.join(' ').toLowerCase().includes(q) && !nextIsHeader) continue;
    begin();
    const tag = nextIsHeader ? 'th' : 'td';
    const cls = nextIsHeader ? 'py-2 px-3 text-xs uppercase text-slate-300 bg-slate-900/90' : 'py-2 px-3';
    html += '<tr>' + r.map(c => `<${tag} class="${cls}">${esc(c)}</${tag}>`).join('') + '</tr>';
    nextIsHeader = false;
  }
  close();
  return html;
}
 
function render() {
  const rows = data[current];
  const view = document.getElementById('view');
  if (!rows) { view.innerHTML = ''; return; }
  const isStats = current === 'Player Stats';
  const search = isStats
    ? `<input id="q" oninput="render()" placeholder="Search player…" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm mb-4">`
    : '';
  const keepQ = document.getElementById('q')?.value || '';
  view.innerHTML = `<h2 class="font-display text-3xl font-bold">${esc(current.toUpperCase())}</h2>` + search +
    (current === 'Rosters' ? renderRosters(rows) : renderGeneric(rows, isStats));
  const qEl = document.getElementById('q');
  if (qEl && keepQ) { qEl.value = keepQ; qEl.focus(); }
}
 
function buildNav() {
  document.getElementById('nav').innerHTML = Object.keys(TABS).map(label =>
    `<button data-tab="${esc(label)}" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-300 hover:text-white ${label === current ? 'active' : ''}">${esc(label)}</button>`
  ).join('');
  document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => {
    current = b.dataset.tab;
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
}
 
async function load() {
  const err = document.getElementById('error');
  const results = await Promise.allSettled(Object.entries(TABS).map(async ([label, tab]) => [label, await fetchTab(tab)]));
  const failed = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') data[r.value[0]] = r.value[1];
    else failed.push(Object.keys(TABS)[i]);
  });
  document.getElementById('loader').classList.add('hidden');
  if (failed.length === results.length) {
    err.classList.remove('hidden');
    err.innerHTML = 'Could not load the sheet. Make sure it is shared as <b>"Anyone with the link can view"</b>.';
    return;
  }
  err.classList.toggle('hidden', !failed.length);
  if (failed.length) err.textContent = 'Some tabs failed to load: ' + failed.join(', ') + '. Check the tab names in TABS.';
  document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  render();
}
 
buildNav();
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
