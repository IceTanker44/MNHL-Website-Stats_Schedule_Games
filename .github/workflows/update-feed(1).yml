name: Update video feed
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed
        run: node scripts/fetch-feed.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Save feed.json
        run: |
          git config user.name "mnhl-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Update video feed" && git push)
